# Local PostgreSQL for the automated tests. Credentials and database name match
# `.env.test`, which is the only connection string the test suite ever uses.
#
# Storage is a tmpfs so that every `up` starts from an empty cluster: the suite
# relies on the database being disposable, not on cleaning up after itself.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ex3
      POSTGRES_PASSWORD: ex3
      POSTGRES_DB: ex3_test
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=ex3 --dbname=ex3_test']
      interval: 2s
      timeout: 3s
      retries: 20
