name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Credentials match backend/.env.test, which is the only connection string
    # the test suite reads. Keeping them identical locally and here means no
    # database configuration is duplicated in this workflow.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ex3
          POSTGRES_PASSWORD: ex3
          POSTGRES_DB: ex3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ex3 --dbname=ex3_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm prettier

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Last so that a newly published advisory, which the commit under test did
      # not introduce, never masks a lint, type or test failure.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm prettier

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
