name: Migrate database

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# Cancelling `prisma migrate deploy` part-way leaves the database partly migrated.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A pull request opened from a fork whose branch is also named `master`
    # produces a CI run that passes the trigger's branch filter, so only a push
    # to this repository may reach the production database.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # `workflow_run` checks out the default branch by default, which may
        # already be ahead of the commit whose CI passed.
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup backend
        uses: ./.github/actions/setup-pnpm-package
        with:
          package: backend
          install-args: --prod

      # Prisma's CLI checks the server's certificate and hostname only with
      # `sslaccept=strict` and the CA in `sslcert`. It ignores libpq's
      # `verify-full` and `sslrootcert`, and with them connects unverified.
      - name: Prisma migration
        run: |
          : "${DATABASE_CA_CERT:?Set the DATABASE_CA_CERT variable of the production environment}"
          ca="$RUNNER_TEMP/database-ca.crt"
          printf '%s\n' "$DATABASE_CA_CERT" > "$ca"
          DIRECT_URL="$DIRECT_URL?sslmode=require&sslaccept=strict&sslcert=$ca" pnpm exec prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_CA_CERT: ${{ vars.DATABASE_CA_CERT }}
